 function moments(){return `<section class="moments"><div class="row between"><span class="eyebrow">Little moments, big memories</span><span class="badge">TAP TO EXPLORE</span></div><h2 style="margin-top:10px">${sceneData[scene].title}</h2><div class="scene-switch" aria-label="Choose an illustrated scene">${[['voiddeck','Void deck'],['mrt','MRT'],['playground','Playground']].map(([id,label])=>`<button class="filter ${scene===id?'active':''}" data-scene="${id}" aria-pressed="${scene===id}">${label}</button>`).join('')}</div>${sceneUI(scene)}<p class="scene-prompt" aria-live="polite">${esc(scenePrompt||'Tap a + to uncover a question. What does this scene remind you of?')}</p><p class="small muted">User-supplied illustrations · everyday scenes, not site photographs.</p></section>`}
 function reflection(p){return `<section class="reflection"><span class="eyebrow">Make this memory yours</span><h3 style="margin:9px 0">What does this place bring back?</h3><p class="small muted">Your reflection stays on this browser when saving is available. It is not published or treated as historical evidence.</p><label for="reflection-note" class="small" style="display:block;margin:14px 0 6px">Your memory or thought</label><textarea id="reflection-note" maxlength="600" placeholder="I remember…">${esc(reflections[p.id]||'')}</textarea><button class="btn secondary" style="width:100%;margin-top:12px" data-save-reflection="${p.id}">Save my reflection</button><p id="reflection-status" class="small muted" role="status" style="margin-top:10px">${esc(reflectionWarning)}</p></section>`}
 function nav(active){return `<nav aria-label="Main navigation">${[['discover','search','Discover'],['map','map','Map'],['passport','book','My PastPort'],['about','info','About']].map(([id,i,label])=>`<button data-go="${id}" class="${active===id?'active':''}" ${active===id?'aria-current="page"':''}>${icon(i)}${label}</button>`).join('')}</nav>`}
 function warning(){return store.warning?`<p class="warning" role="status">${esc(store.warning)}</p>`:''}
 function stamp(p,r){return `<div class="stamp" aria-label="${esc(p.name)} memory stamp"><h3>${p.name}</h3><svg viewBox="0 0 180 64" aria-hidden="true"><path d="M10 56h160 M30 55V23h60v32 M96 55V10h43v45 M44 36h14v10H44 M107 22h12v12h-12"/></svg><span class="eyebrow">Singapore · Memory stamp</span><span class="stamp-date">${date(r.collectedAt)}</span></div>`}
 function map(){const pins=[['central',25,35],['playground',63,48],['park',45,75]];return `<div class="map"><svg class="base" viewBox="0 0 400 260" aria-hidden="true"><defs><pattern id="grid" width="45" height="45" patternUnits="userSpaceOnUse"><path d="M45 0H0v45" fill="none" stroke="#d3cdb5"/></pattern></defs><rect width="400" height="260" fill="url(#grid)"/><ellipse cx="340" cy="50" rx="55" ry="42" fill="#bec9a1"/><ellipse cx="63" cy="209" rx="55" ry="37" fill="#bfd2cc"/><path d="M-10 10l420 210 M100-10l115 290" stroke="#d0c6aa" stroke-width="27"/><path d="M-10 10l420 210 M100-10l115 290" stroke="#f5eedb" stroke-width="21"/><path d="M118 116L270 142 198 215" stroke="#a52d2d" stroke-width="2" stroke-dasharray="5 6" fill="none"/></svg><span class="map-title">TOA PAYOH</span>${pins.map(([id,x,y],i)=>`<button class="pin ${selected===id?'selected':''} ${store.records.some(r=>r.landmarkId===id)?'collected':''}" style="left:${x}%;top:${y}%" data-pin="${id}" aria-label="${data[i].name}${store.records.some(r=>r.landmarkId===id)?', collected':''}" aria-pressed="${selected===id}"><span>${store.records.some(r=>r.landmarkId===id)?'✓':i+1}</span></button>`).join('')}<span class="map-label">Illustrated map · not to scale · suggested trail</span></div>`}
 function preview(){const p=data.find(p=>p.id===selected);return `<div class="map-preview row between"><div><span class="eyebrow">Stop ${p.no}</span><h3 style="font-size:18px">${p.name}</h3></div><button class="icon-btn" data-go="place/${p.id}" aria-label="Explore ${p.name}">${icon('arrow')}</button></div>`}
 function discover(isMap){return `<main><header class="top row between"><span class="brand">PastPort</span><span class="pill">Singapore field guide</span></header><div class="intro"><p class="eyebrow">Your neighbourhood, remembered</p><h1>${isMap?'Take a little<br>walk back.':'Eh, last time<br>here got what?'}</h1><p class="muted">Familiar streets. Unheard memories.<br>Discover a little piece of Toa Payoh.</p></div>${warning()}${!isMap?moments():''}${map()}${preview()}${!isMap?`<label class="search">${icon('search')}<input id="search" aria-label="Search places" placeholder="Find a place or memory…" value="${esc(query)}"></label><div class="filters" aria-label="Filter places">${['All','Town centre','Playground','Park'].map(f=>`<button data-filter="${f}" class="filter ${filter===f?'active':''}" aria-pressed="${filter===f}">${f}</button>`).join('')}</div>`:''}<div class="section-title row between"><h2 style="font-size:24px">${isMap?'Your suggested stops':'Stories around you'}</h2><span class="small muted">3 places</span></div><div id="cards" class="stack">${cards()}</div>${!isMap?photoStrip():''}<p class="small muted" style="margin-top:20px">Explore in any order. No location permission needed.</p></main>${nav(isMap?'map':'discover')}`}
 function cards(){const filtered=data.filter(p=>(filter==='All'||p.type===filter)&&(p.name+' '+p.teaser).toLowerCase().includes(query.toLowerCase()));return filtered.length?filtered.map(p=>`<button class="landmark" data-go="place/${p.id}"><div class="thumb">${art(p)}</div><div><span class="eyebrow">${p.no} · ${store.records.some(r=>r.landmarkId===p.id)?'Collected ✓':p.type}</span><h3>${p.name}</h3><p>${p.teaser}</p></div><span class="chevron">${icon('arrow')}</span></button>`).join(''):'<p class="note">No matching places. Try another search or filter.</p>'}
 function memory(p){return `<section class="memory"><div class="row between"><span class="eyebrow">Someone remembers…</span><span class="badge">DEMO MEMORY</span></div><blockquote>“${p.memory}”</blockquote><p class="small muted">Written sample · no real resident attributed</p><p class="small muted" style="margin-top:10px">This illustrates the experience; it is not an oral-history recording.</p></section>`}
 function detail(p){const r=store.records.find(r=>r.landmarkId===p.id);return `<main class="detail"><header class="row between top"><button class="icon-btn" data-go="discover" aria-label="Back to Discover">${icon('back')}</button><span class="pill">Stop ${p.no} of 03</span></header><p class="eyebrow">Neighbourhood discovery</p><h1 style="margin:10px 0;color:var(--wine)">${p.name}</h1><p class="small muted">${icon('pin')} Toa Payoh, Singapore</p><div class="hero-art illustrated-hero">${p.id==='playground'?sceneUI('playground',false):art(p)}</div><p class="art-credit">${p.id==='playground'?'User-supplied playground illustration':'Original illustrative artwork'} · not a site photograph</p><div class="tabs" role="tablist">${[['story','Story'],['memory','Memories'],['visit','Visit']].map(([id,l])=>`<button role="tab" id="tab-${id}" aria-selected="${tab===id}" aria-controls="detail-panel" data-tab="${id}" class="${tab===id?'active':''}">${l}</button>`).join('')}</div><section role="tabpanel" id="detail-panel" aria-labelledby="tab-${tab}">${tab==='story'?`<h2>Everyday places,<br>shared memories.</h2><p class="body-copy">${p.teaser} This prototype explores how a place can become an invitation to listen, remember and reconnect.</p><div class="note">${icon('photo')}<h3 style="font-size:18px">Historical image unavailable</h3><p style="margin-top:8px">A verified archival photograph has not been supplied. There is no historical comparison for this stop yet.</p></div>${memory(p)}<div style="margin-top:22px"><span class="eyebrow">Sources & credits</span><p class="small muted" style="margin-top:8px">Place names are selected prototype stops. Historical claims and archival assets are pending verification. Landmark artwork and quoted memories are demo content. The playground scene is a user-supplied illustration.</p><a class="small" href="https://www.roots.gov.sg/" target="_blank" rel="noopener noreferrer">Explore Roots heritage resources ↗</a></div>`:tab==='memory'?`${memory(p)}${sceneUI(p.id==='playground'?'playground':'voiddeck',false)}${reflection(p)}<p class="question">${p.prompt}</p><p class="small muted">Real resident contributions and replies are planned for a later version.</p>`:`<h2>Explore at your own pace.</h2><p class="body-copy">The illustrated trail is a suggestion, not walking navigation. Check the destination and actual route in your maps app.</p><a class="btn secondary" href="https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(p.name+', Singapore')}" target="_blank" rel="noopener noreferrer">${icon('map')} Open in Maps ↗</a><p class="note" style="margin-top:20px">Memory stamps record stories you opened. They do not verify that you physically visited.</p>`}</section>${warning()}</main><div class="footer-cta">${r?`<div class="row between" style="margin-bottom:10px"><span class="small" style="color:var(--wine);font-weight:bold">Collected ✓</span><span class="small muted">${date(r.collectedAt)}</span></div><button class="btn" data-open-book="${p.id}">View in My PastPort</button>`:`<button class="btn" data-collect="${p.id}">Collect Memory Stamp</button><p class="small muted">Save this story, not proof of a visit.</p>`}</div>`}
 function passport(){const records=store.records;let p,r;if(records.length){page=Math.min(page,records.length-1);r=records[page];p=data.find(p=>p.id===r.landmarkId)}return `<main class="paper-grid"><header class="row between top"><span class="eyebrow">Your heritage collection</span><span class="small muted">${records.length} / 3</span></header>${warning()}${!bookOpen?`<h1 style="color:var(--wine)">Your stories,<br>kept close.</h1><p class="muted" style="margin-top:12px">A little booklet of places and memories.</p><button class="cover" data-book aria-label="Open My PastPort"><div class="cover-inner">${icon('book')}<h1>PASTPORT</h1><p style="letter-spacing:2px;font-size:13px">SINGAPORE<br>HERITAGE COLLECTION</p><svg class="cover-art" viewBox="0 0 180 110" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="M0 100h180 M20 100V55a30 30 0 0 1 60 0v45 M96 100V15h45v85 M50 25l17-20 34 30-20 20"/></svg><p class="eyebrow">Explore · Discover · Remember</p></div></button><p class="serif muted" style="text-align:center;margin-top:22px;font-style:italic">Tap to open · ${records.length} stories collected</p>`:records.length?`<div class="row between"><h1 style="font-size:34px;color:var(--wine)">My PastPort</h1><button class="icon-btn" data-book-close aria-label="Close booklet">×</button></div><div class="progress"><div style="width:${records.length/3*100}%"></div></div><p class="small muted">${records.length} of 3 stories collected · saved on this browser</p><article class="book-page paper-grid"><span class="eyebrow">Memory ${p.no}</span><h2 style="color:var(--wine);margin-top:8px">${p.name}</h2>${stamp(p,r)}<div class="hero-art" style="height:145px;margin-bottom:12px">${art(p)}</div><span class="badge">DEMO MEMORY</span><p class="book-memory">“${p.memory}”</p>${reflections[p.id]?`<div class="personal-note"><span class="eyebrow">Your reflection</span><p style="margin-top:8px;white-space:pre-wrap">${esc(reflections[p.id])}</p><span class="small muted">Personal note · not a historical account</span></div>`:''}<p class="small muted">Collected ${date(r.collectedAt)} · original date retained</p><button class="btn" style="margin-top:18px;width:100%" data-go="place/${p.id}">Revisit this story</button></article><p class="small muted" style="text-align:center;margin-top:16px">Swipe the page or use the arrows to turn.</p><div class="pager"><button data-page="-1" aria-label="Previous memory" ${page===0?'disabled':''}>←</button><span class="small">${page+1} / ${records.length}</span><button data-page="1" aria-label="Next memory" ${page===records.length-1?'disabled':''}>→</button></div>`:`<div class="empty">${icon('book')}<h2>Your first memory<br>is around the corner.</h2><p class="muted">Explore a story, collect its stamp,<br>and keep it here.</p><button class="btn" data-go="discover">Find a story</button><button class="btn text" data-book-close>Back to cover</button></div>`}</main>${nav('passport')}`}
 function celebration(p){const r=store.records.find(r=>r.landmarkId===p.id);if(!r)return detail(p);return `<main class="celebration paper-grid"><p class="eyebrow">Memory stamp collected</p>${stamp(p,r)}<h1>Shiok!</h1><h2>Another story collected.</h2><p class="muted">One more piece of the neighbourhood,<br>saved in your PastPort.</p>${warning()}<div class="actions"><button class="btn" data-open-book="${p.id}">View My PastPort</button><button class="btn secondary" data-go="discover">Keep Exploring</button><button class="btn text" data-go="place/${p.id}">Revisit story</button></div></main>`}
 function about(){return `<main><header class="top"><span class="brand">PastPort</span></header><p class="eyebrow">A Singapore heritage field guide</p><h1 style="margin:14px 0 24px">Made for<br>remembering.</h1><h2>About this prototype</h2><p class="body-copy">Discover places, encounter a memory, and keep a stamp. This is a standalone demonstration inspired by the supplied PastPort screen designs.</p><h3 style="margin-top:25px">Sources & credits</h3><p class="body-copy">The app combines user-supplied Singaporean scene illustrations, supplied community photos, photo extracts from the supplied UI screenshots, and original stylised landmark artwork. Original creator and licensing details for the supplied scenes have not been provided. The scene illustrations and screenshot photos are not verified depictions of the named landmarks. Community-photo locations and dates are also unverified. All quoted recollections are written demo samples; no real contributors are represented. Your own saved reflections are labelled separately.</p><div class="link-list"><a href="https://www.roots.gov.sg/" target="_blank" rel="noopener noreferrer">Roots — heritage research starting point ↗</a><a href="https://www.nas.gov.sg/archivesonline/" target="_blank" rel="noopener noreferrer">National Archives of Singapore — research starting point ↗</a></div><h3 style="margin-top:25px">Your collection</h3><p class="body-copy">Collection records are saved locally in this browser when storage is available. There is no account sync or analytics in this code. Clearing browser data removes saved stamps.</p><h3 style="margin-top:25px">Camera demonstration</h3><p class="body-copy">Recognition is simulated. You can try an example without opening a camera or granting permissions.</p><button class="btn secondary" data-go="camera">Try a scan example</button></main>${nav('about')}`}
 function camera(){return `<main class="welcome"><header class="row between"><button class="icon-btn" data-go="discover" aria-label="Back to discovery">${icon('back')}</button><span class="badge">SIMULATED RECOGNITION</span></header><h1 style="font-size:39px;margin-top:18px">A glimpse of<br>what’s next.</h1><div class="hero-art" style="height:260px">${art(data[0])}</div><p class="muted">This example opens a prepared landmark.<br>No camera, upload, or recognition service is active.</p><button class="btn" data-go="place/central">Try Toa Payoh Central</button><button class="btn secondary" data-go="discover">Browse places instead</button></main>`}
 function welcome(){return `<main class="welcome photo-welcome"><div class="welcome-photo skyline"><img src="${PastPortPhotos.skyline}" alt="Singapore skyline scene extracted from the supplied design screenshot"><div class="photo-fade"></div></div><div class="welcome-wordmark"><p class="eyebrow">A Singapore heritage field guide</p><h1>PastPort</h1><p class="tagline" style="margin-top:12px">Eh, last time here got what?</p><p class="muted" style="margin-top:18px">Discover a place. Uncover a memory.<br>Keep a little piece of your neighbourhood.</p></div><div class="welcome-photo shophouses"><img src="${PastPortPhotos.shophouses}" alt="Colourful shophouse scene extracted from the supplied design screenshot"></div><div class="welcome-actions"><button class="btn" data-go="discover">Let’s explore ${icon('arrow')}</button><button class="btn text" data-go="passport">Open My PastPort</button><p class="foot">Screenshot-supplied scene imagery · location unverified<br>No location or camera permission required.</p></div></main>`}


 let flipping=false,swipeStart=null;
 function turnPage(direction){
  const count=store.records.length,next=page+direction;if(flipping||next<0||next>=count)return;
  const sheet=app.querySelector('.book-page');const reduced=window.matchMedia?.('(prefers-reduced-motion: reduce)').matches;
  const y=window.scrollY||0;
  function finish(){if(location.hash!=='#passport'){flipping=false;return;}page=next;render();window.scrollTo(0,y);const incoming=app.querySelector('.book-page');if(incoming&&!reduced&&incoming.animate){incoming.style.transformOrigin=direction>0?'left center':'right center';incoming.animate([{transform:`perspective(1200px) rotateY(${direction>0?80:-80}deg)`,opacity:.3},{transform:'perspective(1200px) rotateY(0deg)',opacity:1}],{duration:260,easing:'cubic-bezier(.2,.7,.2,1)'}).finished.catch(()=>{}).then(()=>{flipping=false;incoming.style.transformOrigin=''});}else flipping=false;document.getElementById('announcer').textContent=`Memory page ${page+1} of ${count}`;}
  if(!sheet||reduced||!sheet.animate){finish();return;}flipping=true;sheet.style.transformOrigin=direction>0?'left center':'right center';sheet.animate([{transform:'perspective(1200px) rotateY(0deg)',opacity:1},{transform:`perspective(1200px) rotateY(${direction>0?-85:85}deg)`,opacity:.25}],{duration:230,easing:'cubic-bezier(.55,0,.9,.5)',fill:'forwards'}).finished.catch(()=>{}).then(finish);
 }
 function openCover(){if(flipping)return;const cover=app.querySelector('.cover'),reduced=window.matchMedia?.('(prefers-reduced-motion: reduce)').matches;const finish=()=>{if(location.hash!=='#passport'){flipping=false;return;}bookOpen=true;flipping=false;render()};if(!cover||reduced||!cover.animate){finish();return;}flipping=true;cover.style.transformOrigin='left center';cover.animate([{transform:'perspective(1200px) rotateY(0deg)'},{transform:'perspective(1200px) rotateY(-85deg)',opacity:.25}],{duration:380,easing:'cubic-bezier(.4,0,.2,1)',fill:'forwards'}).finished.catch(()=>{}).then(finish);}
 app.addEventListener('pointerdown',e=>{if(!bookOpen||!e.target.closest('.book-page')||e.target.closest('button,a,textarea,input'))return;swipeStart={x:e.clientX,y:e.clientY};});
 app.addEventListener('pointerup',e=>{if(!swipeStart)return;const dx=e.clientX-swipeStart.x,dy=e.clientY-swipeStart.y;swipeStart=null;if(Math.abs(dx)>65&&Math.abs(dy)<45)turnPage(dx<0?1:-1);});
 app.addEventListener('pointercancel',()=>{swipeStart=null});
 function render(){const route=location.hash.slice(1)||'welcome';const parts=route.split('/');if(parts[0]==='place'||parts[0]==='collected'){const p=data.find(p=>p.id===parts[1]);app.innerHTML=p?(parts[0]==='place'?detail(p):celebration(p)):`<main><h1>Place not found.</h1><p class="body-copy">Return to the neighbourhood to choose a story.</p><button class="btn" data-go="discover">Back to Discover</button></main>`;}else app.innerHTML=route==='discover'?discover(false):route==='map'?discover(true):route==='passport'?passport():route==='about'?about():route==='camera'?camera():welcome();window.scrollTo(0,0);const heading=app.querySelector('h1');if(heading){heading.tabIndex=-1;heading.focus({preventScroll:true})}}
 function go(route){if(location.hash==='#'+route)render();else location.hash=route}
 app.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.scene){scene=b.dataset.scene;scenePrompt='';const y=window.scrollY;render();window.scrollTo(0,y)}else if(b.dataset.prompt){scenePrompt=b.dataset.prompt;const target=app.querySelector('.scene-prompt');if(target){target.textContent=scenePrompt;document.getElementById('announcer').textContent=scenePrompt}}else if(b.dataset.saveReflection){const value=document.getElementById('reflection-note').value.trim().slice(0,600);if(value)reflections[b.dataset.saveReflection]=value;else delete reflections[b.dataset.saveReflection];try{storage.setItem('pastport.reflections.v1',JSON.stringify(reflections));reflectionWarning=value?'Saved. Find it with this stamp in your booklet.':'Reflection cleared.'}catch{reflectionWarning='Kept for this session only; browser saving is unavailable.'}document.getElementById('reflection-status').textContent=reflectionWarning}else if(b.dataset.go){tab='story';go(b.dataset.go)}else if(b.dataset.pin){selected=b.dataset.pin;render()}else if(b.dataset.filter){filter=b.dataset.filter;render()}else if(b.dataset.tab){tab=b.dataset.tab;render();document.getElementById('tab-'+tab)?.focus()}else if(b.dataset.collect){store.collect(b.dataset.collect);document.getElementById('announcer').textContent='Memory stamp collected';go('collected/'+b.dataset.collect)}else if(b.hasAttribute('data-book')){openCover()}else if(b.hasAttribute('data-book-close')){bookOpen=false;render()}else if(b.dataset.openBook){bookOpen=true;page=store.records.findIndex(r=>r.landmarkId===b.dataset.openBook);go('passport')}else if(b.dataset.page){turnPage(Number(b.dataset.page))}});
 app.addEventListener('input',e=>{if(e.target.id==='search'){query=e.target.value;document.getElementById('cards').innerHTML=cards()}});
 app.addEventListener('keydown',e=>{if(location.hash==='#passport'&&bookOpen&&!e.target.closest('input,textarea')&&['ArrowRight','ArrowLeft'].includes(e.key)){e.preventDefault();turnPage(e.key==='ArrowRight'?1:-1);return;}if(e.target.getAttribute('role')==='tab'&&['ArrowRight','ArrowLeft','Home','End'].includes(e.key)){e.preventDefault();const ids=['story','memory','visit'];const i=ids.indexOf(tab);tab=e.key==='Home'?ids[0]:e.key==='End'?ids[2]:ids[(i+(e.key==='ArrowRight'?1:2))%3];render();document.getElementById('tab-'+tab).focus()}});
 window.addEventListener('hashchange',render);render();
})();
</script></body></html>
