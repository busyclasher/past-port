 const park='<path d="M0 147Q100 97 220 153T420 125v95H0z" fill="#a0ae86"/><path d="M230 220Q150 160 210 130" fill="none" stroke="#e0cbaa" stroke-width="28"/><g fill="#65785e"><circle cx="65" cy="91" r="38"/><circle cx="340" cy="83" r="47"/></g><path d="M65 112v63 M340 112v58" stroke="#675840" stroke-width="9"/><path d="M101 154h83 M111 154v22 M171 154v22 M101 141h83" stroke="#6b503c" stroke-width="7"/>';
 const dragon='<path d="M0 165h420v55H0" fill="#cfb07c"/><path d="M86 168Q90 79 158 103L221 130 266 97 281 50 315 50 331 87 297 128 244 171z" fill="'+p.color+'" stroke="#814938" stroke-width="4"/><path d="M278 65h30 M130 120l65 43 M143 111l65 42 M160 112l66 37" stroke="#e9cc8b" stroke-width="7"/><circle cx="308" cy="62" r="4" fill="#3d3328"/><path d="M275 101l-15 8" stroke="#3d3328" stroke-width="3"/>';
 return `<svg class="art" viewBox="0 0 420 220" role="img" aria-label="Illustrative ${esc(p.type.toLowerCase())} artwork, not a photograph"><rect width="420" height="220" fill="#eae2c9"/><circle cx="330" cy="40" r="25" fill="#f6d7a1"/><path d="M0 140Q100 120 220 140T420 136v84H0z" fill="#d5d5b5"/>${p.form==='park'?park:p.form==='dragon'?dragon:town}<g fill="#56493b"><circle cx="200" cy="170" r="4"/><path d="M200 174v14 M200 180l-6 5 M200 180l6 5 M200 188l-4 12 M200 188l5 12" stroke="#56493b" stroke-width="2"/></g></svg>`;
 }

 const sceneData={voiddeck:{title:'Lepak, and remember.',alt:'Illustration of an older resident and a delivery rider at a void deck',spots:[['Neighbours',25,52,'Who made your neighbourhood feel like home?'],['Meeting spots',67,42,'Where did you meet your friends after school?']]},mrt:{title:'More than a journey.',alt:'Illustration of two people with a baby on an MRT escalator',spots:[['Companions',39,48,'Who did you enjoy travelling with?'],['Journeys',69,51,'What everyday journey do you remember most?']]},playground:{title:'One more turn, lah.',alt:'Illustration of a young person and an older resident beside a dragon playground',spots:[['Games',33,41,'What games did you make up with your friends?'],['People',75,54,'Who would you like to revisit this place with?']]}};
 function sceneUI(key,interactive=true){const item=sceneData[key];return `<div class="scene"><img src="${PastPortIllustrations[key]}" alt="${item.alt}" draggable="false">${interactive?item.spots.map(([label,x,y,prompt],i)=>`<button class="scene-hotspot" style="left:${x}%;top:${y}%" data-prompt="${esc(prompt)}" aria-label="Explore ${label.toLowerCase()} memory prompt"><span aria-hidden="true">+</span><span class="hotspot-label">${label}</span></button>`).join(''):''}</div>`}
 function moments(){return `<section class="moments"><div class="row between"><span class="eyebrow">Little moments, big memories</span><span class="badge">TAP TO EXPLORE</span></div><h2 style="margin-top:10px">${sceneData[scene].title}</h2><div class="scene-switch" aria-label="Choose an illustrated scene">${[['voiddeck','Void deck'],['mrt','MRT'],['playground','Playground']].map(([id,label])=>`<button class="filter ${scene===id?'active':''}" data-scene="${id}" aria-pressed="${scene===id}">${label}</button>`).join('')}</div>${sceneUI(scene)}<p class="scene-prompt" aria-live="polite">${esc(scenePrompt||'Tap a + to uncover a question. What does this scene remind you of?')}</p><p class="small muted">User-supplied illustrations · everyday scenes, not site photographs.</p></section>`}
 function speechMemory(p){return `<section class="speech-memory" data-speech-memory data-speech-place="${p.id}" data-speech-state="idle"><div data-speech-view="idle"><p class="small muted" style="margin-bottom:8px">Prefer to speak?</p><button class="btn secondary speech-entry" data-speech-open>Speak my memory</button></div><div class="speech-panel" data-speech-view="notice" hidden><h4>Speak my memory</h4><p class="speech-notice">Your audio will be sent to ElevenLabs to transcribe. You can review the words before saving.</p><p class="small muted" style="margin-top:10px">English · maximum 60 seconds. The transcript remains editable. PastPort does not retain raw audio.</p><div class="speech-controls"><button class="btn" data-speech-start>Start recording</button><button class="btn text" data-speech-cancel>Cancel</button></div></div><div class="speech-panel" data-speech-view="connecting" hidden><div class="speech-working"><span class="speech-spinner" aria-hidden="true"></span><strong>Preparing transcription…</strong></div><p class="small muted" style="margin-top:8px">Your browser may ask for microphone permission.</p><button class="btn text" data-speech-cancel>Cancel</button></div><div class="speech-panel" data-speech-view="recording" hidden><div class="recording-line"><span class="row"><span class="recording-dot" aria-hidden="true"></span><strong>Recording</strong></span><span class="small" data-speech-elapsed>0 / 60 seconds</span></div><div class="speech-live" data-speech-live aria-live="polite">Listening…</div><div class="speech-controls"><button class="btn" data-speech-stop>Stop recording</button><button class="btn text" data-speech-cancel>Cancel</button></div></div><div class="speech-panel" data-speech-view="finalizing" hidden><div class="speech-working"><span class="speech-spinner" aria-hidden="true"></span><strong>Finishing transcription…</strong></div><p class="small muted" style="margin-top:8px">Waiting for the final words before review.</p><button class="btn text" data-speech-cancel>Cancel</button></div><div class="speech-panel" data-speech-view="review" hidden><h4>Review your words</h4><label class="small" for="speech-review-${p.id}">Editable transcription</label><textarea class="speech-review" id="speech-review-${p.id}" data-speech-review aria-describedby="speech-guidance-${p.id} speech-review-count-${p.id}"></textarea><div class="row between" style="margin-top:6px"><span class="small muted" id="speech-review-count-${p.id}" data-speech-review-count>0 / 600 characters</span><span class="small muted" id="speech-guidance-${p.id}" data-speech-guidance>Edit anything that needs correcting.</span></div><div class="speech-controls"><button class="btn" data-speech-save>Save reflection</button><button class="btn secondary" data-speech-discard>Discard</button></div></div><div class="speech-panel" data-speech-view="error" hidden><h4>Recording unavailable</h4><p class="small muted">Manual typing above is still available and any existing reflection is unchanged.</p><div class="speech-controls"><button class="btn secondary" data-speech-retry>Try again</button><button class="btn text" data-speech-cancel>Use text input</button></div></div><p class="small speech-status" data-speech-status role="status" aria-live="polite"></p></section>`}
 function reflection(p){const value=reflections[p.id]||'',saved=Object.prototype.hasOwnProperty.call(reflections,p.id);return `<section class="reflection"><span class="eyebrow">Make this memory yours</span><h3 style="margin:9px 0">What does this place bring back?</h3><p class="small muted">Saved only in this browser when local storage is available. It is never published, rewritten, or treated as historical evidence.</p><label for="reflection-note" class="small" style="display:block;margin:14px 0 6px">Type your reflection</label><textarea id="reflection-note" data-reflection-place="${p.id}" maxlength="600" aria-describedby="reflection-count reflection-status" placeholder="I remember…">${esc(value)}</textarea><div class="row between" style="margin-top:6px"><span id="reflection-count" class="small muted" aria-live="polite">${value.length} / 600 characters</span><span class="small muted">Private to this browser</span></div><div class="row" style="margin-top:12px"><button class="btn secondary" style="flex:1" data-save-reflection="${p.id}">Save reflection</button>${saved?`<button class="btn text" data-remove-reflection="${p.id}">Remove</button>`:''}</div><p id="reflection-status" class="small muted" role="status" tabindex="-1" style="margin-top:10px">${esc(reflectionFeedback[p.id]||'')}</p>${speechMemory(p)}</section>`}
 function nav(active){return `<nav aria-label="Main navigation">${[['discover','search','Discover'],['map','map','Map'],['passport','book','My PastPort'],['about','info','About']].map(([id,i,label])=>`<button data-go="${id}" class="${active===id?'active':''}" ${active===id?'aria-current="page"':''}>${icon(i)}${label}</button>`).join('')}</nav>`}
 function warning(){return store.warning?`<p class="warning" role="status">${esc(store.warning)}</p>`:''}
 function stamp(p,r,press=false){return `<div class="stamp ${press?'stamp--press':''}" aria-label="${esc(p.name)} memory stamp, collected ${date(r.collectedAt)}"><h3 class="${press?'stamp-reveal':''}">${p.name}</h3><svg viewBox="0 0 180 64" aria-hidden="true"><path d="M10 56h160 M30 55V23h60v32 M96 55V10h43v45 M44 36h14v10H44 M107 22h12v12h-12"/></svg><span class="eyebrow">Singapore · Memory stamp</span><span class="stamp-date ${press?'stamp-reveal':''}">${date(r.collectedAt)}</span></div>`}
 function map(){const pins=[['central',25,35],['playground',63,48],['park',45,75]];return `<div class="map" role="group" aria-label="Illustrated map of three independently accessible Toa Payoh memory stops"><svg class="base" viewBox="0 0 400 260" aria-hidden="true"><defs><pattern id="grid" width="45" height="45" patternUnits="userSpaceOnUse"><path d="M45 0H0v45" fill="none" stroke="#d3cdb5"/></pattern></defs><rect width="400" height="260" fill="url(#grid)"/><ellipse cx="340" cy="50" rx="55" ry="42" fill="#bec9a1"/><ellipse cx="63" cy="209" rx="55" ry="37" fill="#bfd2cc"/><path d="M-10 10l420 210 M100-10l115 290" stroke="#d0c6aa" stroke-width="27"/><path d="M-10 10l420 210 M100-10l115 290" stroke="#f5eedb" stroke-width="21"/><path class="suggested-route" ${suggestedOrder?'':'hidden'} d="M118 116L270 142 198 215" stroke="#a52d2d" stroke-width="2" stroke-dasharray="5 6" fill="none"/></svg><span class="map-title">TOA PAYOH</span>${pins.map(([id,x,y],i)=>{const p=data.find(p=>p.id===id),collected=store.records.some(r=>r.landmarkId===id);return `<button class="pin ${selected===id?'selected':''} ${collected?'collected':''}" style="left:${x}%;top:${y}%" data-pin="${id}" aria-label="${p.name}${collected?', collected':''}${suggestedOrder?', suggested stop '+(i+1):''}" aria-pressed="${selected===id}"><span>${collected?'✓':suggestedOrder?i+1:'•'}</span></button>`}).join('')}<span class="map-label">Illustrated map · not to scale${suggestedOrder?' · suggested order':''}</span></div><div class="map-tools"><span class="small muted">Drawn connection is not walking navigation.</span><button class="map-order" data-order aria-pressed="${suggestedOrder}">${suggestedOrder?'Suggested order on':'Suggested order off'}</button></div>`}
 function preview(){const p=data.find(p=>p.id===selected),collected=store.records.some(r=>r.landmarkId===p.id);return `<section class="map-preview" aria-label="Selected landmark"><div class="map-preview-grid"><div class="thumb">${art(p)}</div><div><span class="eyebrow">${suggestedOrder?'Suggested stop '+p.no+' · ':''}${collected?'Collected ✓':p.type}</span><h3>${p.name}</h3><p>${p.teaser}</p></div></div><div class="map-preview-actions"><button class="btn" data-go="place/${p.id}" aria-label="Explore ${p.name}">Explore</button><a class="btn secondary maps-link" href="https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(p.name+', Singapore')}" target="_blank" rel="noopener noreferrer" aria-label="Open ${p.name} in external Maps">Maps ↗</a></div></section>`}
 function discover(isMap){return `<main><header class="top row between"><span class="brand">PastPort</span><span class="pill">Singapore field guide</span></header><div class="intro"><p class="eyebrow">Your neighbourhood, remembered</p><h1>${isMap?'Take a little<br>walk back.':'Eh, last time<br>here got what?'}</h1><p class="muted">Familiar streets. Unheard memories.<br>Discover a little piece of Toa Payoh.</p></div>${warning()}${!isMap?moments():''}${map()}${preview()}${!isMap?`<label class="search">${icon('search')}<input id="search" aria-label="Search places" placeholder="Find a place or memory…" value="${esc(query)}"></label><div class="filters" aria-label="Filter places">${['All','Town centre','Playground','Park'].map(f=>`<button data-filter="${f}" class="filter ${filter===f?'active':''}" aria-pressed="${filter===f}">${f}</button>`).join('')}</div>`:''}<div class="section-title row between"><h2 style="font-size:24px">${isMap?'Landmark list':'Stories around you'}</h2><span class="small muted">3 places</span></div><p class="small muted" style="margin:-8px 0 14px">Every stop can be opened independently. This list remains available if the illustrated map cannot be viewed.</p><div id="cards" class="stack">${cards()}</div><p class="small muted" style="margin-top:20px">Explore in any order. No location permission needed.</p></main>${nav(isMap?'map':'discover')}`}
 function cards(){const filtered=data.filter(p=>(filter==='All'||p.type===filter)&&(p.name+' '+p.teaser).toLowerCase().includes(query.toLowerCase()));return filtered.length?filtered.map(p=>{const collected=store.records.some(r=>r.landmarkId===p.id);return `<button class="landmark" data-select-card="${p.id}" aria-current="${selected===p.id}"><div class="thumb">${art(p)}</div><div><span class="eyebrow">${p.no} · ${collected?'Collected ✓':p.type}</span><h3>${p.name}</h3><p>${p.teaser}</p></div><span class="chevron" aria-hidden="true">${selected===p.id?'Selected':'Select'}</span></button>`}).join(''):'<p class="note">No matching places. Try another search or filter.</p>'}
 function memory(p){return `<section class="memory"><div class="row between"><span class="eyebrow">Someone remembers…</span><span class="badge">DEMO MEMORY</span></div><blockquote>“${p.memory}”</blockquote><p class="small muted">Written sample · no real resident attributed</p><p class="small muted" style="margin-top:10px">This illustrates the experience; it is not an oral-history recording.</p></section>`}
 function detail(p){const r=store.records.find(r=>r.landmarkId===p.id);return `<main class="detail"><header class="row between top"><button class="icon-btn" data-go="discover" aria-label="Back to Discover">${icon('back')}</button><span class="pill">Stop ${p.no} of 03</span></header><p class="eyebrow">Neighbourhood discovery</p><h1 style="margin:10px 0;color:var(--wine)">${p.name}</h1><p class="small muted">${icon('pin')} Toa Payoh, Singapore</p><div class="hero-art illustrated-hero">${p.id==='playground'?sceneUI('playground',false):art(p)}</div><p class="art-credit">${p.id==='playground'?'User-supplied playground illustration':'Original illustrative artwork'} · not a site photograph</p><div class="tabs" role="tablist">${[['story','Story'],['memory','Memories'],['visit','Visit']].map(([id,l])=>`<button role="tab" id="tab-${id}" aria-selected="${tab===id}" aria-controls="detail-panel" data-tab="${id}" class="${tab===id?'active':''}">${l}</button>`).join('')}</div><section role="tabpanel" id="detail-panel" aria-labelledby="tab-${tab}">${tab==='story'?`<h2>Everyday places,<br>shared memories.</h2><p class="body-copy">${p.teaser} This prototype explores how a place can become an invitation to listen, remember and reconnect.</p><div class="note">${icon('photo')}<h3 style="font-size:18px">Historical image unavailable</h3><p style="margin-top:8px">A verified archival photograph has not been supplied. There is no historical comparison for this stop yet.</p></div>${memory(p)}<div style="margin-top:22px"><span class="eyebrow">Sources & credits</span><p class="small muted" style="margin-top:8px">Place names are selected prototype stops. Historical claims and archival assets are pending verification. Landmark artwork and quoted memories are demo content. The playground scene is a user-supplied illustration.</p><a class="small" href="https://www.roots.gov.sg/" target="_blank" rel="noopener noreferrer">Explore Roots heritage resources ↗</a></div>`:tab==='memory'?`${memory(p)}${sceneUI(p.id==='playground'?'playground':'voiddeck',false)}${reflection(p)}<p class="question">${p.prompt}</p><p class="small muted">Real resident contributions and replies are planned for a later version.</p>`:`<h2>Explore at your own pace.</h2><p class="body-copy">The illustrated trail is a suggestion, not walking navigation. Check the destination and actual route in your maps app.</p><a class="btn secondary" href="https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(p.name+', Singapore')}" target="_blank" rel="noopener noreferrer">${icon('map')} Open in Maps ↗</a><p class="note" style="margin-top:20px">Memory stamps record stories you opened. They do not verify that you physically visited.</p>`}</section>${warning()}</main><div class="footer-cta">${r?`<div class="row between" style="margin-bottom:10px"><span class="small" style="color:var(--wine);font-weight:bold">Collected ✓</span><span class="small muted">${date(r.collectedAt)}</span></div><button class="btn" data-open-book="${p.id}">View in My PastPort</button>`:`<button class="btn" data-collect="${p.id}">Collect Memory Stamp</button><p class="small muted">Save this story, not proof of a visit.</p>`}</div>`}
 function passport(targetId=''){const records=store.records;if(targetId){const target=records.findIndex(r=>r.landmarkId===targetId);if(target>=0){page=target;bookOpen=true}}let p,r;if(records.length){page=Math.max(0,Math.min(page,records.length-1));r=records[page];p=data.find(p=>p.id===r.landmarkId)}const remaining=data.length-records.length;return `<main class="paper-grid"><header class="row between top"><span class="eyebrow">Your heritage collection</span><span class="small muted">${records.length} / ${data.length}</span></header>${warning()}${!bookOpen?`<h1 style="color:var(--wine)">Your stories,<br>kept close.</h1><p class="muted" style="margin-top:12px">A little booklet of places and memories.</p><button class="cover" data-book aria-label="Open My PastPort"><div class="cover-inner">${icon('book')}<h1>PASTPORT</h1><p style="letter-spacing:2px;font-size:13px">SINGAPORE<br>HERITAGE COLLECTION</p><svg class="cover-art" viewBox="0 0 180 110" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="M0 100h180 M20 100V55a30 30 0 0 1 60 0v45 M96 100V15h45v85 M50 25l17-20 34 30-20 20"/></svg><p class="eyebrow">Explore · Discover · Remember</p></div></button><p class="serif muted" style="text-align:center;margin-top:22px;font-style:italic">Tap to open · ${records.length} ${records.length===1?'story':'stories'} collected</p>`:records.length?`<div class="row between"><h1 style="font-size:34px;color:var(--wine)">My PastPort</h1><button class="icon-btn" data-book-close aria-label="Close booklet">×</button></div><div class="progress" aria-label="${records.length} of ${data.length} stories collected"><div style="width:${records.length/data.length*100}%"></div></div><p class="small muted">${records.length} of ${data.length} stories collected · saved on this browser</p><article class="book-page paper-grid" aria-label="Memory page ${page+1} of ${records.length}"><span class="eyebrow">Memory ${p.no}</span><h2 style="color:var(--wine);margin-top:8px">${p.name}</h2>${stamp(p,r)}<div class="hero-art" style="height:145px;margin-bottom:12px">${art(p)}</div><span class="badge">DEMO MEMORY</span><p class="book-memory">“${p.memory}”</p><div class="personal-note"><span class="eyebrow">Your reflection</span>${reflections[p.id]?`<p style="margin-top:8px;white-space:pre-wrap">${esc(reflections[p.id])}</p><span class="small muted">Personal note · not a historical account</span>`:`<p class="small muted" style="margin-top:8px">No personal reflection saved yet.</p><button class="btn text" data-reflect="${p.id}">Add a reflection</button>`}</div><p class="small muted">Collected ${date(r.collectedAt)} · original date retained</p><button class="btn" style="margin-top:18px;width:100%" data-go="place/${p.id}">Revisit this landmark</button></article><div class="pager" aria-label="Memory pages"><button data-page="-1" aria-label="Previous memory" ${page===0?'disabled':''}>← Previous</button><span class="small pager-count" role="status" aria-live="polite">Page ${page+1} of ${records.length}</span><button data-page="1" aria-label="Next memory" ${page===records.length-1?'disabled':''}>Next →</button></div>${remaining?`<section class="partial-next"><strong>${remaining} ${remaining===1?'story':'stories'} still to discover.</strong><p class="small muted" style="margin-top:5px">Choose any remaining landmark; the suggested order is optional.</p><button class="btn secondary" data-go="map">Explore another stop</button></section>`:''}`:`<div class="empty">${icon('book')}<h2>Your first memory<br>is around the corner.</h2><p class="muted">Explore any landmark story, collect its memory stamp, and keep it here. No physical visit is required.</p><button class="btn" data-go="map">Choose a landmark</button><button class="btn text" data-book-close>Back to cover</button></div>`}</main>${nav('passport')}`}
 function celebration(p){const r=store.records.find(r=>r.landmarkId===p.id);if(!r)return detail(p);return `<main class="celebration paper-grid"><p class="eyebrow">Memory stamp collected</p>${stamp(p,r,true)}<div class="success-reveal"><h1>Saved</h1><h2>${p.name}</h2><p class="muted">Collected ${date(r.collectedAt)}.<br>This records a story you opened, not physical attendance.</p></div>${warning()}<div class="actions success-reveal"><button class="btn" data-open-book="${p.id}">View My PastPort</button><button class="btn secondary" data-go="map">Keep Exploring</button></div></main>`}
 function about(){return `<main><header class="top"><span class="brand">PastPort</span></header><p class="eyebrow">A Singapore heritage field guide</p><h1 style="margin:14px 0 24px">Made for<br>remembering.</h1><h2>About this prototype</h2><p class="body-copy">Discover places, encounter a memory, and keep a stamp. This is a standalone demonstration inspired by the supplied PastPort screen designs.</p><h3 style="margin-top:25px">Sources & credits</h3><p class="body-copy">The app combines user-supplied Singaporean scene illustrations with original stylised landmark artwork. Original creator and licensing details for the supplied scenes have not been provided. They are not photographs of the named landmarks. All quoted recollections are written demo samples; no real contributors are represented. Your own saved reflections are labelled separately.</p><div class="link-list"><a href="https://www.roots.gov.sg/" target="_blank" rel="noopener noreferrer">Roots — heritage research starting point ↗</a><a href="https://www.nas.gov.sg/archivesonline/" target="_blank" rel="noopener noreferrer">National Archives of Singapore — research starting point ↗</a></div><h3 style="margin-top:25px">Your collection</h3><p class="body-copy">Collection records are saved locally in this browser when storage is available. There is no account sync or analytics in this code. Clearing browser data removes saved stamps.</p><h3 style="margin-top:25px">Camera demonstration</h3><p class="body-copy">Recognition is simulated. You can try an example without opening a camera or granting permissions.</p><button class="btn secondary" data-go="camera">Try a scan example</button></main>${nav('about')}`}
 function camera(){return `<main class="welcome"><header class="row between"><button class="icon-btn" data-go="discover" aria-label="Back to discovery">${icon('back')}</button><span class="badge">SIMULATED RECOGNITION</span></header><h1 style="font-size:39px;margin-top:18px">A glimpse of<br>what’s next.</h1><div class="hero-art" style="height:260px">${art(data[0])}</div><p class="muted">This example opens a prepared landmark.<br>No camera, upload, or recognition service is active.</p><button class="btn" data-go="place/central">Try Toa Payoh Central</button><button class="btn secondary" data-go="discover">Browse places instead</button></main>`}
 function welcome(){return `<main class="welcome"><div class="row between"><span class="eyebrow">A Singapore heritage field guide</span><span class="small muted">01 / 01</span></div><div class="panorama welcome-scene">${sceneUI('voiddeck',false)}</div><div><h1>PastPort</h1><p class="tagline" style="margin-top:12px">Eh, last time here got what?</p></div><p class="muted">Discover a place. Uncover a memory.<br>Keep a little piece of your neighbourhood.</p><button class="btn" data-go="discover">Let’s explore ${icon('arrow')}</button><button class="btn text" data-go="passport">Open My PastPort</button><p class="foot">Toa Payoh edition · illustrative prototype<br>No location or camera permission required.</p></main>`}
 function render(){collecting=false;const route=location.hash.slice(1)||'welcome';const parts=route.split('/');if(parts[0]==='place'||parts[0]==='collected'){const p=data.find(p=>p.id===parts[1]);app.innerHTML=p?(parts[0]==='place'?detail(p):celebration(p)):`<main><h1>Place not found.</h1><p class="body-copy">Return to the neighbourhood to choose a story.</p><button class="btn" data-go="discover">Back to Discover</button></main>`;}else app.innerHTML=route==='discover'?discover(false):route==='map'?discover(true):parts[0]==='passport'?passport(parts[1]||''):route==='about'?about():route==='camera'?camera():welcome();window.scrollTo(0,0);const heading=app.querySelector('h1');if(heading){heading.tabIndex=-1;heading.focus({preventScroll:true})}}
 function go(route){if(location.hash==='#'+route)render();else location.hash=route}
 app.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;const leaving=reflectionDirty&&!b.dataset.saveReflection&&!b.dataset.removeReflection&&(b.dataset.go||b.dataset.tab||b.dataset.collect||b.dataset.openBook||b.hasAttribute('data-book-close'));if(leaving&&!confirm('Discard your unsaved reflection changes?'))return;if(leaving)reflectionDirty=false;if(b.dataset.scene){scene=b.dataset.scene;scenePrompt='';const y=window.scrollY;render();window.scrollTo(0,y)}else if(b.dataset.prompt){scenePrompt=b.dataset.prompt;const target=app.querySelector('.scene-prompt');if(target){target.textContent=scenePrompt;document.getElementById('announcer').textContent=scenePrompt}}else if(b.dataset.saveReflection){const id=b.dataset.saveReflection,value=document.getElementById('reflection-note').value.slice(0,600);if(!value.trim()){reflectionFeedback[id]=Object.prototype.hasOwnProperty.call(reflections,id)?'The editor is empty. Use Remove to delete the saved reflection.':'Nothing to save yet. Write a reflection first.';document.getElementById('reflection-status').textContent=reflectionFeedback[id];return}reflections[id]=value;try{storage.setItem('pastport.reflections.v1',JSON.stringify(reflections));reflectionFeedback[id]='Saved. Your reflection will appear with this stamp in My PastPort.'}catch{reflectionFeedback[id]='Saved for this session only. Browser storage is unavailable, so it may be lost when this tab closes.'}reflectionDirty=false;reflectionPlace='';render();document.getElementById('reflection-status')?.focus()}else if(b.dataset.removeReflection){const id=b.dataset.removeReflection;delete reflections[id];try{storage.setItem('pastport.reflections.v1',JSON.stringify(reflections));reflectionFeedback[id]='Reflection removed. The memory stamp is unchanged.'}catch{reflectionFeedback[id]='Removed for this session only. Browser storage is unavailable.'}reflectionDirty=false;reflectionPlace='';render()}else if(b.dataset.reflect){tab='memory';go('place/'+b.dataset.reflect)}else if(b.dataset.go){tab='story';go(b.dataset.go)}else if(b.dataset.pin){selected=b.dataset.pin;render()}else if(b.dataset.selectCard){selected=b.dataset.selectCard;render();requestAnimationFrame(()=>app.querySelector('.map-preview')?.scrollIntoView({block:'center'}))}else if(b.hasAttribute('data-order')){suggestedOrder=!suggestedOrder;render()}else if(b.dataset.filter){filter=b.dataset.filter;render()}else if(b.dataset.tab){tab=b.dataset.tab;render();document.getElementById('tab-'+tab)?.focus()}else if(b.dataset.collect){if(collecting)return;collecting=true;b.disabled=true;b.setAttribute('aria-busy','true');const record=store.collect(b.dataset.collect);if(record){document.getElementById('announcer').textContent=`${data.find(p=>p.id===record.landmarkId)?.name||'Memory'} stamp saved`;go('collected/'+record.landmarkId)}else{collecting=false;b.disabled=false;b.removeAttribute('aria-busy')}}else if(b.hasAttribute('data-book')){bookOpen=true;render()}else if(b.hasAttribute('data-book-close')){bookOpen=false;if(location.hash.startsWith('#passport/'))go('passport');else render()}else if(b.dataset.openBook){bookOpen=true;page=store.records.findIndex(r=>r.landmarkId===b.dataset.openBook);go('passport/'+b.dataset.openBook)}else if(b.dataset.page){page+=Number(b.dataset.page);const record=store.records[page];if(record)go('passport/'+record.landmarkId)}});
 app.addEventListener('input',e=>{if(e.target.id==='search'){query=e.target.value;document.getElementById('cards').innerHTML=cards()}else if(e.target.id==='reflection-note'){const id=e.target.dataset.reflectionPlace,value=e.target.value.slice(0,600),saved=reflections[id]||'';reflectionDirty=value!==saved;reflectionPlace=reflectionDirty?id:'';document.getElementById('reflection-count').textContent=`${value.length} / 600 characters`;document.getElementById('reflection-status').textContent=reflectionDirty?'Unsaved changes.':''}});
 app.addEventListener('click',e=>{const link=e.target.closest('a');if(link&&reflectionDirty&&!confirm('Discard your unsaved reflection changes?'))e.preventDefault();else if(link)reflectionDirty=false});
 app.addEventListener('keydown',e=>{if(e.target.getAttribute('role')==='tab'&&['ArrowRight','ArrowLeft','Home','End'].includes(e.key)){e.preventDefault();const ids=['story','memory','visit'];const i=ids.indexOf(tab);tab=e.key==='Home'?ids[0]:e.key==='End'?ids[2]:ids[(i+(e.key==='ArrowRight'?1:2))%3];render();document.getElementById('tab-'+tab).focus()}});
 window.addEventListener('beforeunload',e=>{if(reflectionDirty){e.preventDefault();e.returnValue=''}});window.addEventListener('hashchange',()=>{const next=location.hash;if(restoringHash){restoringHash=false;lastHash=next;render();return}if(reflectionDirty&&!confirm('Discard your unsaved reflection changes?')){restoringHash=true;location.hash=lastHash;return}reflectionDirty=false;lastHash=next;render()});render();
})();
</script><script src="demo-interactions.js" defer></script><script src="dist/speech-memory.js" defer></script></body></html>
